<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stop.css">
</head>
<body>
    <div class="stopwatch">
        <h1 id="displayTime">00:00:00</h1>
        <div class="buttons">
            <img src="https://w7.pngwing.com/pngs/401/177/png-transparent-video-play-button.png" onclick="watchstop()">
            <img src="https://png.pngtree.com/element_our/png/20181229/play-video-graphic-icon-design-template-png_300932.jpg" onclick="watchstart()">
            <img src="https://e7.pngegg.com/pngimages/609/67/png-clipart-computer-icons-restart-miscellaneous-text-thumbnail.png" onclick="watchreset()" id="reset">
        </div>
    </div>
    




    <script src="watch.js"></script>
</body>
</html>
